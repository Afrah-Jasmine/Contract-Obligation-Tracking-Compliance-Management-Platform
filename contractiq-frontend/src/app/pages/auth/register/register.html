<div class="auth-card card-glass">
  <div class="auth-header">
    <div class="auth-logo">IQ</div>
    <h2>Create Account</h2>
    <p class="auth-subtitle">Join ContractIQ Platform</p>
  </div>

  <form (ngSubmit)="register()" class="auth-form">

    <div class="form-group">
      <label>Full Name</label>
      <input
        type="text"
        name="fullName"
        class="form-control"
        [(ngModel)]="fullName"
        placeholder="e.g. Jane Doe"
        required
      />
    </div>

    <div class="form-group">
      <label>Email Address</label>
      <input
        type="email"
        name="email"
        class="form-control"
        [(ngModel)]="email"
        placeholder="e.g. jane@contractiq.com"
        required
      />
    </div>

    <div class="form-group">
      <label>Password</label>
      <input
        type="password"
        name="password"
        class="form-control"
        [(ngModel)]="password"
        placeholder="••••••••"
        required
      />
    </div>

    <div class="form-group">
      <label>Role</label>
      <select name="role" class="form-control" [(ngModel)]="role">
        @for (r of roles; track r) {
          <option [value]="r">{{ r }}</option>
        }
      </select>
    </div>

    @if (error) {
      <div class="alert alert-error">
        <span>{{ error }}</span>
      </div>
    }

    @if (success) {
      <div class="alert alert-success">
        <span>{{ success }}</span>
      </div>
    }

    <button type="submit" class="btn btn-primary btn-block" [disabled]="loading">
      @if (loading) {
        <span class="spinner-sm"></span> Registering...
      } @else {
        Create Account
      }
    </button>

    <div class="auth-footer-links center">
      <span>Already have an account? <a routerLink="/login">Sign In</a></span>
    </div>

  </form>
</div>
