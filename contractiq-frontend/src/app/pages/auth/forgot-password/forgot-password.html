<div class="auth-card card-glass">
  <div class="auth-header">
    <div class="auth-logo">IQ</div>
    <h2>Reset Password</h2>
    <p class="auth-subtitle">Enter your email to receive recovery instructions</p>
  </div>

  @if (!submitted) {
    <form (ngSubmit)="submitReset()" class="auth-form">

      <div class="form-group">
        <label>Email Address</label>
        <input
          type="email"
          name="email"
          class="form-control"
          [(ngModel)]="email"
          placeholder="e.g. user@contractiq.com"
          required
        />
      </div>

      <button type="submit" class="btn btn-primary btn-block">
        Send Reset Link
      </button>

      <div class="auth-footer-links center">
        <a routerLink="/login">← Back to Sign In</a>
      </div>

    </form>
  } @else {
    <div class="success-box">
      <div class="icon-check">✓</div>
      <h3>Instructions Sent</h3>
      <p>If an account exists for <strong>{{ email }}</strong>, you will receive password reset instructions shortly.</p>
      <a routerLink="/login" class="btn btn-secondary btn-block" style="text-decoration:none;">Back to Sign In</a>
    </div>
  }
</div>
